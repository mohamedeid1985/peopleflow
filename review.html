<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="pf-build" content="B20261022-1400">
<title>تقييم فترة الاختبار | PeopleFlow</title>
<style>
  :root{--navy:#12173F;--gold:#D8B159;--gold-l:#E6C677;--gold-d:#C99A3E;--bg:#0B0E2A;--card:#151a44;--line:#283070;--text:#EEF0FF;--muted:#9EA2D0;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:18px 14px 40px;background:radial-gradient(900px 500px at 80% -10%,rgba(216,177,89,.16),transparent 60%),var(--bg);color:var(--text);font:16px/1.7 system-ui,"Segoe UI",Tahoma,sans-serif}
  .card{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .logo{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:var(--navy);font:800 21px/52px system-ui;text-align:center}
  h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:13.5px}
  dl{margin:0 0 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
  dt{color:var(--muted)} dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  h2{font-size:16px;margin:20px 0 8px;color:var(--gold-l)}
  .crit{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .crit .l{font-weight:700;margin-bottom:6px}.crit .en{color:var(--muted);font-weight:400;font-size:13px}
  .rate{display:flex;gap:6px;flex-wrap:wrap}
  .rate label,.opt label{cursor:pointer}
  .rate input,.opt input{position:absolute;opacity:0;pointer-events:none}
  .rate span{display:inline-block;min-width:46px;padding:7px 10px;border-radius:10px;border:1px solid #3a4190;text-align:center;font-weight:700}
  .rate input:checked+span{background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:var(--navy);border-color:transparent}
  .rate input:focus-visible+span,.opt input:focus-visible+span{outline:2px solid var(--gold)}
  .opt{display:flex;gap:8px;flex-wrap:wrap}
  .opt span{display:inline-block;padding:9px 14px;border-radius:12px;border:1px solid #3a4190;font-weight:600}
  .opt input:checked+span{background:#2a3180;border-color:var(--gold)}
  textarea,input[type=text]{width:100%;background:#0f1338;color:var(--text);border:1px solid #3a4190;border-radius:12px;padding:10px 12px;font:inherit}
  textarea{min-height:70px;resize:vertical}
  .field{margin-bottom:12px}.field label.t{display:block;font-weight:700;margin-bottom:5px}
  .score{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);margin:10px 0}
  button{width:100%;border:0;border-radius:14px;padding:14px 16px;font:800 17px system-ui;cursor:pointer;background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:var(--navy);margin-top:10px}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06)}
  .err{background:rgba(192,57,43,.18);border:1px solid rgba(192,57,43,.5)}
  .en{direction:ltr;text-align:left;color:var(--muted);font-size:13.5px}
  .hide{display:none}
</style>
</head>
<body>
<main class="card" id="app"><div class="head"><div class="logo">PF</div><div>جارِ التحميل…</div></div></main>
<script>
/* 90-day (probation) review for the employee's direct manager. The link holds a one-time token:
   probation_form_info shows who is reviewed, probation_form_submit saves the review into PeopleFlow › Performance. */
(function(){
  var URL_ = 'https://ksfuzzxepaebhoqjpthu.supabase.co', KEY = 'sb_publishable_HT2Izajqkd2h8wPzpsC4xQ_zytylGMk';
  var app = document.getElementById('app');
  var t = new URLSearchParams(location.search).get('t') || '';
  var CRIT = [['skills','المعرفة والمهارات الوظيفية','Job knowledge & skills'],['quality','جودة وإنجاز الشغل','Quality & output'],['attendance','الالتزام والمواعيد','Attendance & punctuality'],
    ['team','التعاون والتواصل','Teamwork & communication'],['learning','سرعة التعلم والمبادرة','Learning & initiative']];
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function rpc(fn, body){
    return fetch(URL_ + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ 'apikey':KEY, 'Authorization':'Bearer ' + KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  var head = '<div class="head"><div class="logo">PF</div><div><h1>تقييم فترة الاختبار (أول 90 يوم)</h1><div class="sub">Probation review — first 90 days</div></div></div>';
  function show(ar, en, bad){ app.innerHTML = head + '<div class="msg' + (bad ? ' err' : '') + '">' + esc(ar) + '<div class="en">' + esc(en) + '</div></div>'; }
  if(!/^[0-9a-fA-F-]{36}$/.test(t)){ show('الرابط غير صحيح.', 'Invalid link.', true); return; }
  function radios(name, opts){ return opts.map(function(o){ return '<label><input type="radio" name="' + name + '" value="' + esc(o[0]) + '"><span>' + esc(o[1]) + '</span></label>'; }).join(''); }
  rpc('probation_form_info', { p_token: t }).then(function(m){
    if(!m){ show('الرابط غير صحيح أو انتهت صلاحيته أو اتستخدم قبل كده.', 'This link is invalid, expired or already used.', true); return; }
    if(m.status === 'completed'){ show('التقييم ده اتسجل قبل كده. شكرًا لك.', 'This review was already submitted. Thank you.'); return; }
    app.innerHTML = head
      + '<dl><dt>الموظف</dt><dd>' + esc(m.employee) + (m.code ? ' (' + esc(m.code) + ')' : '') + '</dd>'
      + '<dt>الوظيفة</dt><dd>' + esc(m.job || '—') + ' · ' + esc(m.department || '—') + '</dd>'
      + '<dt>الشركة</dt><dd>' + esc(m.company) + '</dd>'
      + '<dt>تاريخ التعيين</dt><dd dir="ltr" style="text-align:right">' + esc(m.hire_date) + '</dd>'
      + '<dt>ميعاد التقييم</dt><dd dir="ltr" style="text-align:right">' + esc(m.due_date) + '</dd></dl>'
      + '<h2>1. المعايير <span class="en">(1 = ضعيف … 5 = ممتاز)</span></h2>'
      + CRIT.map(function(c){ return '<div class="crit"><div class="l">' + esc(c[1]) + ' <span class="en">' + esc(c[2]) + '</span></div><div class="rate">' + radios('c_' + c[0], [1,2,3,4,5].map(function(n){ return [n, n + ' ★']; })) + '</div></div>'; }).join('')
      + '<div class="score" id="score">التقييم العام: — / 5</div>'
      + '<h2>2. أهداف أول 90 يوم</h2><div class="opt">' + radios('goals', [['met','اتحققت'],['partly','اتحقق جزء منها'],['not_met','ما اتحققتش']]) + '</div>'
      + '<h2>3. القرار</h2><div class="opt">' + radios('decision', [['confirm','✅ تثبيت الموظف'],['extend','⏳ تمديد فترة الاختبار'],['terminate','❌ إنهاء التعاقد']]) + '</div>'
      + '<div class="opt hide" id="ext" style="margin-top:8px;">' + radios('extend', [['30','30 يوم'],['60','60 يوم'],['90','90 يوم']]) + '</div>'
      + '<h2>4. ملاحظات</h2>'
      + '<div class="field"><label class="t" for="strengths">نقاط القوة</label><textarea id="strengths" maxlength="2000"></textarea></div>'
      + '<div class="field"><label class="t" for="improve">محتاج يطوّر</label><textarea id="improve" maxlength="2000"></textarea></div>'
      + '<div class="field"><label class="t" for="notes">ملاحظات إضافية</label><textarea id="notes" maxlength="2000"></textarea></div>'
      + '<div class="field"><label class="t" for="who">اسمك (المقيِّم) *</label><input type="text" id="who" maxlength="120" value="' + esc(m.manager || '') + '"></div>'
      + '<button id="send">إرسال التقييم · Submit</button><div id="out"></div>';
    var val = function(n){ var x = app.querySelector('input[name="' + n + '"]:checked'); return x ? x.value : ''; };
    app.addEventListener('change', function(){
      var v = CRIT.map(function(c){ return Number(val('c_' + c[0])) || 0; }).filter(Boolean);
      document.getElementById('score').textContent = 'التقييم العام: ' + (v.length ? (v.reduce(function(a,b){ return a + b; }, 0) / v.length).toFixed(1) : '—') + ' / 5' + (v.length === 5 ? '' : '  (' + v.length + ' من 5)');
      document.getElementById('ext').classList.toggle('hide', val('decision') !== 'extend');
    });
    document.getElementById('send').onclick = function(){
      var out = document.getElementById('out'), crit = {}, miss = false;
      CRIT.forEach(function(c){ var v = Number(val('c_' + c[0])); if(!v) miss = true; crit[c[0]] = v; });
      var dec = val('decision'), who = document.getElementById('who').value.trim();
      var err = miss ? 'قيّم كل المعايير الخمسة.' : !dec ? 'اختار القرار.' : !who ? 'اكتب اسمك.' : '';
      if(err){ out.innerHTML = '<div class="msg err">' + esc(err) + '</div>'; return; }
      var btn = this; btn.disabled = true;
      rpc('probation_form_submit', { p_token: t, p_data: { criteria: crit, goals: val('goals') || null, decision: dec, extendDays: dec === 'extend' ? Number(val('extend') || 30) : null,
        strengths: document.getElementById('strengths').value, improve: document.getElementById('improve').value, notes: document.getElementById('notes').value, evaluator: who } })
        .then(function(r){
          if(r === 'ok'){ show('✅ تم إرسال التقييم وتسجيله في PeopleFlow. شكرًا لك.', 'Review submitted and saved in PeopleFlow. Thank you.'); return; }
          if(r === 'already_done' || r === 'invalid'){ show('التقييم ده اتسجل قبل كده أو الرابط انتهت صلاحيته.', 'This review was already submitted or the link expired.', true); return; }
          btn.disabled = false; out.innerHTML = '<div class="msg err">' + esc({ missing_criteria:'قيّم كل المعايير الخمسة.', missing_decision:'اختار القرار.', missing_name:'اكتب اسمك.' }[r] || 'حدث خطأ، حاول مرة أخرى.') + '</div>';
        }).catch(function(){ btn.disabled = false; out.innerHTML = '<div class="msg err">حدث خطأ، حاول مرة أخرى. <span class="en">Something went wrong, please try again.</span></div>'; });
    };
  }).catch(function(){ show('حدث خطأ، حاول مرة أخرى.', 'Something went wrong, please try again.', true); });
})();
</script>
</body>
</html>
