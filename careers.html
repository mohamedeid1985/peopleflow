<script>
/* ============================== Recruitment: CV reader (free, runs in the browser) ==============================
   Shared by the app (candidate form) and the public careers page (tools/careers/build.py inlines this file).
     cvReadFile(file)          -> Promise<text>   PDF via pdf.js, Word (.docx) via mammoth, both from cdnjs on first use;
                                                  scanned PDFs give little or no text -> the person fills the form by hand
     cvParse(text, reqText)    -> { name, email, phone, linkedin, years, skills:[matched requirement phrases], score }
   Nothing leaves the browser here; no paid service, no AI. The result only pre-fills a form that a person checks. */
// npm files on jsDelivr with integrity hashes: a changed file on the CDN is refused by the browser
const CV_LIBS = {
  pdf: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  docx: 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js',
};
const CV_SRI = {
  [CV_LIBS.pdf]: 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e',
  [CV_LIBS.docx]: 'sha384-nFoSjZIoH3CCp8W639jJyQkuPHinJ2NHe7on1xvlUA7SuGfJAfvMldrsoAVm6ECz',
};
function cvLoadScript(url){
  return new Promise((ok, bad)=>{ if(document.querySelector('script[data-cv="'+url+'"]')) return ok();
    const s = document.createElement('script'); s.src = url; s.async = true; s.dataset.cv = url;
    if(CV_SRI[url]){ s.integrity = CV_SRI[url]; s.crossOrigin = 'anonymous'; }
    s.onload = ()=>ok(); s.onerror = ()=>bad(new Error('load '+url)); document.head.appendChild(s); });
}
async function cvReadFile(file){
  const name = String(file && file.name || '').toLowerCase();
  if(/\.pdf$/.test(name) || file.type==='application/pdf'){
    if(!window.pdfjsLib) await cvLoadScript(CV_LIBS.pdf);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = CV_LIBS.pdfWorker;
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false })  /* CVE-2024-4367 */.promise;
    const out = [];
    for(let p=1; p<=Math.min(pdf.numPages, 8); p++){
      const tc = await (await pdf.getPage(p)).getTextContent(); let line = '', lastY = null;
      tc.items.forEach(it=>{ const y = Math.round(it.transform[5]); if(lastY!==null && Math.abs(y-lastY)>3){ out.push(line); line=''; } line += (line && !/\s$/.test(line) ? ' ' : '') + it.str; lastY = y; });
      out.push(line);
    }
    return out.join('\n');
  }
  if(/\.docx$/.test(name)){
    if(!window.mammoth) await cvLoadScript(CV_LIBS.docx);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value || '';
  }
  return ''; // only PDF and .docx are accepted (the pickers and the server reject anything else)
}
function cvDigits(s){ return String(s||'').replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function cvParse(text, reqText){
  const T = cvDigits(text||''), lines = T.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean), r = { name:'', email:'', phone:'', linkedin:'', years:null, skills:[], score:null };
  const em = T.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/); if(em) r.email = em[0].toLowerCase();
  const li = T.match(/(?:https?:\/\/)?(?:[a-z]{2,3}\.)?linkedin\.com\/in\/[A-Za-z0-9_\-%]+/i); if(li) r.linkedin = li[0].replace(/^(?!https?:)/i,'https://');
  const phones = (T.match(/\+?\d[\d\s\-().]{6,}\d/g)||[]).map(p=>p.replace(/[^\d+]/g,'')).filter(p=>{ const d = p.replace(/\D/g,''); return d.length>=8 && d.length<=15 && !/^(19|20)\d{2}(19|20)\d{2}$/.test(d); });
  const eg = phones.map(p=>p.replace(/^(\+|00)?20(?=1)/,'0')).find(p=>/^01[0125]\d{8}$/.test(p.replace(/^\+/,'')));
  r.phone = eg || phones[0] || '';
  const bad = /curriculum|resume|résumé|\bcv\b|السيرة|سيرة ذاتية|profile|summary|contact|address|العنوان|@|\d/i;
  const nm = lines.slice(0, 8).find(l=>{ const w = l.split(' '); return w.length>=2 && w.length<=5 && l.length>=5 && l.length<=45 && !bad.test(l) && /^[\p{L}\s.'-]+$/u.test(l); });
  if(nm) r.name = nm;
  const ex = [...T.matchAll(/(\d{1,2})\s*\+?\s*(?:years?|yrs?)\b/gi)].map(m=>+m[1]).concat([...T.matchAll(/(\d{1,2})\s*\+?\s*(?:سنوات|سنة|سنين|عام|أعوام)/g)].map(m=>+m[1])).filter(n=>n>0&&n<=45);
  if(ex.length) r.years = Math.max(...ex);
  else {
    const now = new Date().getFullYear(), iv = [];
    for(const m of T.matchAll(/\b((?:19|20)\d{2})\s*(?:-|–|—|to|إلى|الى|حتى)\s*((?:19|20)\d{2}|present|current|now|date|today|الآن|الان|حاليا|حاليًا|حتى الآن)/gi)){
      const a = +m[1], b = /^\d/.test(m[2]) ? +m[2] : now; if(a<=b && a>=1960 && b<=now) iv.push([a,b]); }
    iv.sort((x,y)=>x[0]-y[0]); let tot = 0, cur = null;
    iv.forEach(([a,b])=>{ if(!cur || a>cur[1]){ if(cur) tot += cur[1]-cur[0]; cur = [a,b]; } else cur[1] = Math.max(cur[1], b); }); if(cur) tot += cur[1]-cur[0];
    if(tot>0 && tot<=45) r.years = tot;
  }
  const phrases = Array.from(new Set(String(reqText||'').split(/[\n,،;؛•·/|]+|\s+(?:and|و)\s+/i).map(s=>s.replace(/^[\s\d.)(*\-–]+/,'').trim()).filter(s=>s.length>=2 && s.length<=40)));
  const low = T.toLowerCase();
  r.skills = phrases.filter(p=>{ const q = p.toLowerCase(); if(/^[a-z0-9+#.\s-]+$/i.test(q)){ const esc = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return new RegExp('(^|[^a-z0-9])'+esc+'([^a-z0-9]|$)','i').test(low); } return low.includes(q); });
  if(phrases.length) r.score = Math.round(r.skills.length/phrases.length*100);
  return r;
}

async function pick(file){

  view.file=file; view.msg=['info',L('بنقرا السي في…','Reading your CV…')]; render();
  let text=''; try{ text=await cvReadFile(file); }catch(e){ text=''; }
  view.text=text||'';
  if(!text.trim()){view.msg=['info',L('اترفع الملف، بس ما قدرناش نقرا منه بيانات — املا البيانات بإيدك.','File attached, but we could not read details from it — please fill the form.')];render();return}
  const p=cvParse(text,(view.job.requirements||'')+'\n'+(view.job.description||'')); view.parsed=p;
  if(!view.f_name&&p.name)view.f_name=p.name; if(!view.f_email&&p.email)view.f_email=p.email; if(!view.f_phone&&p.phone)view.f_phone=p.phone;
  if(!view.f_li&&p.linkedin)view.f_li=p.linkedin; if(!view.f_years&&p.years!=null)view.f_years=String(p.years);
  view.msg=['ok',L('قرينا السي في وملينا البيانات اللي لقيناها — راجعها وكمّل الناقص.','We read your CV and filled what we found — please review and complete the rest.')]; render();
}

  try{
    let path=null;
    if(view.file){ const ext=(view.file.name.match(/\.(pdf|docx)$/i)||[,'pdf'])[1].toLowerCase(); path=CO+'/'+uuid()+'.'+ext;
      const up=await sb.storage.from('recruitment-cvs').upload(path, view.file, {contentType: view.file.type||undefined, upsert:false});
      if(up.error) throw new Error(L('رفع السي في ما نجحش، حاول تاني','The CV upload failed, please try again')); }
    const p=view.parsed||{};
    const r=await sb.rpc('rec_public_apply',{p_company:CO,p_requisition:view.job.id,p_name:val('f_name'),p_email:val('f_email'),p_phone:val('f_phone'),
      p_current_title:val('f_title')||null,p_years:val('f_years')?Number(val('f_years')):null,p_linkedin:val('f_li')||null,p_expected_salary:val('f_sal')?Number(val('f_sal')):null,
      p_message:val('f_msg')||null,p_cv_path:path,p_cv_text:view.text?view.text.slice(0,30000):null,p_parsed:{skills:p.skills||[],score:p.score==null?null:p.score},p_consent:true,p_hp:(document.getElementById('f_web')||{}).value||null});
    if(r.error) throw new Error(L('حصلت مشكلة في الإرسال، حاول تاني بعد شوية','Something went wrong, please try again later'));
    const M={ok:null,duplicate:L('إنت قدّمت على الوظيفة دي قبل كده بنفس الإيميل','You already applied for this position with this e-mail'),closed:L('الوظيفة دي اتقفلت','This position is closed'),limit:L('عدد كبير من المحاولات — حاول بكره','Too many attempts — please try tomorrow'),invalid:L('اكتب الاسم والإيميل والموبايل صح','Please enter a valid name, e-mail and phone'),consent:L('لازم توافق على استخدام بياناتك','Please give your consent')};
    if(r.data==='ok'){view.done=true;view.busy=false;render();window.scrollTo({top:0});return}
    throw new Error(M[r.data]||L('حصلت مشكلة في الإرسال','Something went wrong'));
  }catch(e){view.busy=false;view.msg=['bad',e.message];render()}
}
async function start(){
  setLang(); render(); if(!CO||!isUuid(CO))return;
  try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const r=await sb.rpc('rec_public_jobs',{p_company:CO}); DATA=(r.data&&!r.error)?r.data:{company:L('الوظائف المتاحة','Open positions'),jobs:[]}; DATA.jobs=DATA.jobs||[];
  }catch(e){ DATA={company:L('الوظائف المتاحة','Open positions'),jobs:[]}; }
  if(JOB) view.job=DATA.jobs.find(x=>x.id===JOB)||null;
  setLang(); render();
}
window.__careers={state:()=>({view,DATA})};
start();
})();
</script>
